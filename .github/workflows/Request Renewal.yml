name: Request Renewal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  renewal:
    runs-on: ubuntu-latest

    steps:
      - name: Login and request renewal
        id: renewal
        env:
          RENEWAL_USERNAME: ${{ secrets.RENEWAL_USERNAME }}
          RENEWAL_PASSWORD: ${{ secrets.RENEWAL_PASSWORD }}
        run: |
          set -e

          echo "Logging in..."

          login_response=$(curl -sS \
            -X POST \
            "https://honghong.yyylll.kdns.fr/api/user_login" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36" \
            -d "{\"type\":\"login\",\"username\":\"${RENEWAL_USERNAME}\",\"password\":\"${RENEWAL_PASSWORD}\",\"turnstileToken\":null}")

          token=$(echo "$login_response" | jq -r '.token')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Login failed."
            echo "result=❌ 登录失败" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Hide dynamically generated token in GitHub Actions logs
          echo "::add-mask::$token"

          echo "Login successful."

          echo "Requesting renewal..."

          response=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            "https://honghong.yyylll.kdns.fr/api/request_renewal" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36" \
            -d "{\"token\":\"${token}\",\"username\":\"${RENEWAL_USERNAME}\"}")

          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response: $body"

          msg=$(echo "$body" | jq -r '.msg // "未知响应"')

          if [ "$http_code" = "200" ]; then
            result="✅ 续期请求成功：$msg"
          elif echo "$body" | grep -q "仅限到期前 3 天内申请续期"; then
            result="ℹ️ 暂时无法续期：$msg"
          else
            result="❌ 续期请求失败：$msg"
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Send result to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESULT: ${{ steps.renewal.outputs.result }}
        run: |
          MESSAGE="🔄 续期任务

          用户：${{ secrets.RENEWAL_USERNAME }}
          状态：${RESULT}

          GitHub Actions：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$TG_CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text}')"
