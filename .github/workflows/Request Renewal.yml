name: Request Renewal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  renewal:
    runs-on: ubuntu-latest

    steps:
      - name: Login and request renewal for all users
        id: renewal
        env:
          RENEWAL_USERS: ${{ secrets.RENEWAL_USERS }}
        run: |
          set +e

          RESULTS=""

          while IFS= read -r user; do
            username=$(echo "$user" | jq -r '.username')
            password=$(echo "$user" | jq -r '.password')

            echo "Processing user: $username"

            login_response=$(curl -sS \
              -X POST \
              "https://honghong.yyylll.kdns.fr/api/user_login" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36" \
              -d "$(jq -n \
                --arg username "$username" \
                --arg password "$password" \
                '{type:"login", username:$username, password:$password, turnstileToken:null}')")

            token=$(echo "$login_response" | jq -r '.token')

            if [ -z "$token" ] || [ "$token" = "null" ]; then
              msg=$(echo "$login_response" | jq -r '.msg // "登录失败"')

              echo "Login failed for $username: $msg"

              RESULTS="${RESULTS}❌ ${username}: 登录失败 - ${msg}"$'\n'
              continue
            fi

            # Hide dynamically generated token
            echo "::add-mask::$token"

            echo "Login successful for $username"

            response=$(curl -sS \
              -w "\n%{http_code}" \
              -X POST \
              "https://honghong.yyylll.kdns.fr/api/request_renewal" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36" \
              -d "$(jq -n \
                --arg token "$token" \
                --arg username "$username" \
                '{token:$token, username:$username}')")

            http_code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')

            msg=$(echo "$body" | jq -r '.msg // "未知响应"')

            echo "$username HTTP status: $http_code"
            echo "$username response: $body"

            if [ "$http_code" = "200" ]; then
              RESULTS="${RESULTS}✅ ${username}: ${msg}"$'\n'
            elif echo "$body" | grep -q "仅限到期前 3 天内申请续期"; then
              RESULTS="${RESULTS}ℹ️ ${username}: ${msg}"$'\n'
            else
              RESULTS="${RESULTS}❌ ${username}: ${msg}"$'\n'
            fi

          done < <(echo "$RENEWAL_USERS" | jq -c '.[]')

          echo "Final results:"
          printf "%s" "$RESULTS"

          {
            echo "results<<EOF"
            printf "%s" "$RESULTS"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send result to Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESULTS: ${{ steps.renewal.outputs.results }}
        run: |
          MESSAGE="🔄 续期任务

          ${RESULTS}

          GitHub Actions:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$TG_CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id:$chat_id, text:$text}')"
